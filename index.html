<style>

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{

  font-variant-numeric:tabular-nums;

  overscroll-behavior-y:contain;-webkit-text-size-adjust:100%;
}
button,select,input,textarea{font:inherit;color:inherit}
.hide{display:none !important}

  padding:calc(9px + env(safe-area-inset-top)) 12px 9px}

.ctx{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.ctxBtn{background:none;border:0;padding:2px 0;text-align:left;cursor:pointer;color:#fff;display:block}
.ctxBtn.big{font-size:21px;font-weight:650;letter-spacing:-.015em;line-height:1.15}
.ctxBtn.big .chev{display:inline-block;font-size:13px;color:#98a1b0;margin-left:5px;
  transition:transform .18s ease}
.ctxBtn.big.abierto .chev{transform:rotate(180deg)}
.ctxBtn.small{font-size:13px;color:#b9c0cc;border-bottom:1px dotted rgba(255,255,255,.28);
  padding-bottom:1px}
.iconbtn{position:relative;background:rgba(255,255,255,.12);border:0;color:#fff;
  width:42px;height:42px;border-radius:12px;font-size:18px;display:grid;place-items:center;
  cursor:pointer;flex:0 0 auto}
.iconbtn:active{background:rgba(255,255,255,.26)}
.iconbtn .dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;
  background:#e8a33d;border:1.5px solid var(--ink)}

/* ---------- selector ---------- */
.selNav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.selNav .nav{flex:0 0 auto;width:42px;height:42px;border-radius:11px;border:1px solid var(--line);
  background:#fff;font-size:20px;line-height:1;cursor:pointer;color:var(--ink-2)}
.selFecha{flex:1;text-align:center;line-height:1.2}
.selFecha b{display:block;font-size:16px}
.selFecha span{font-size:13px;color:var(--ink-2)}
.selRow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:6px}
.selRow.act{border-color:var(--ink);background:#f4f3f0;box-shadow:inset 0 0 0 1px var(--ink)}
.selH{flex:0 0 30px;font-size:13px;font-weight:650;color:var(--ink-2)}
.selN{flex:1;min-width:0;line-height:1.2}

.selE{flex:0 0 auto;font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:7px;

.selE.ok{background:#e8f2ec;color:#155c39}
.selE.aviso{background:var(--retraso-bg);color:var(--retraso)}
.otra{width:100%;background:none;border:0;border-top:1px solid var(--line-2);margin-top:8px;
  padding:12px 0 8px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chipL{background:#f0eeea;border:1px solid transparent;color:var(--ink);padding:8px 12px;

.chipL[aria-pressed="true"]{background:var(--ink);color:#fff}
.chipL small{display:block;font-size:10.5px;font-weight:500;opacity:.72;margin-top:2px}
.pend{color:#e8a33d;font-weight:600}

/* ---------- avisos ---------- */
.banner{margin:10px 10px 0;padding:10px 12px;border-radius:11px;font-size:13.5px;line-height:1.4;
  background:var(--falta-bg);border:1px solid var(--falta-ln);color:var(--falta);font-weight:600}

/* ---------- lista ---------- */

.list{padding:9px 10px 0}
.row{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);

  padding:3px 7px;border-radius:6px;background:#f0eeea}
.row .acc.oculto{display:none}
.row .note{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
  background:#fff;display:grid;place-items:center;font-size:13px;color:var(--ink-3)}
.row .note.has{border-color:var(--ink);color:var(--ink);background:#f7f6f3}
.row[data-s="P"] .note{display:none}
.row .st{flex:0 0 auto;width:33px;height:33px;border-radius:9px;display:grid;place-items:center;
  font-size:14.5px;font-weight:700;background:transparent;
  border:2px solid var(--line);color:transparent}
.row[data-s="F"]{background:var(--falta-bg);border-color:var(--falta-ln)}
.row[data-s="F"] .st{background:var(--falta);border-color:var(--falta);color:#fff}
.row[data-s="R"]{background:var(--retraso-bg);border-color:var(--retraso-ln)}
.row[data-s="R"] .st{background:var(--retraso);border-color:var(--retraso);color:#fff}
.row[data-s="J"]{background:var(--just-bg);border-color:var(--just-ln)}
.row[data-s="J"] .st{background:var(--just);border-color:var(--just);color:#fff}

/* ---------- barra inferior ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(247,246,243,.97);

/* ---------- paneles ---------- */
.pane{padding:14px}

.pane p.lead{margin:0 0 15px;color:var(--ink-2);font-size:14px}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line-2)}
th{font-size:11.5px;color:var(--ink-2);font-weight:600;letter-spacing:.03em}
td.n,th.n{text-align:right;width:40px}
tr.alu{cursor:pointer}
tr.alu:active td{background:#faf9f7}
td.det{font-size:13px;color:var(--ink-2);background:#faf9f7;padding:9px 8px}
select,input[type=time],input[type=url],input[type=date]{border:1px solid var(--line);
  border-radius:9px;padding:10px;background:#fff;width:100%}
.grid5{display:grid;grid-template-columns:32px 1fr;gap:8px;align-items:center;margin-bottom:6px}
.grid7{display:grid;grid-template-columns:30px 1fr 1fr;gap:7px;align-items:center;margin-bottom:6px}
.muted{color:var(--ink-2);font-size:13px}
.warnbox{background:var(--retraso-bg);border:1px solid var(--retraso-ln);border-radius:11px;
  padding:11px;font-size:13.5px;margin-bottom:12px;line-height:1.45}
.warnbox.rojo{background:var(--falta-bg);border-color:var(--falta-ln)}
.diag{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--line-2);font-size:14px}
.diag:last-of-type{border-bottom:0}
.si{color:var(--ok);font-weight:650} .no{color:var(--falta);font-weight:650}

/* ---------- hojas modales ---------- */
.ovl{position:fixed;inset:0;background:rgba(28,31,38,.5);z-index:50;display:flex;
  justify-content:center;align-items:flex-start;padding:0 10px}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:14px;padding:16px;
  margin-top:calc(52px + env(safe-area-inset-top));box-shadow:0 12px 40px rgba(0,0,0,.25);
  max-height:calc(100vh - 90px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet h4{margin:0 0 4px;font-size:16px}
.sheet .sub{margin:0 0 11px;font-size:13px;color:var(--ink-2)}
.sheet textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:10px;padding:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(124px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;
  transition:opacity .2s;pointer-events:none;max-width:88%;text-align:center;line-height:1.3}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<script>
"use strict";

/* ========================= DATOS ========================= */
const ALUMNOS = {"1ºD": ["Almela Martínez, Ignacio", "Altemir Seller, Jordi", "Cova Trijillo, Diego Alejandro", "Díaz Vaquerizo, José", "Gallego Guillén, Javier", "García Pérez, Juan Pablo", "Gavira Castillo, David", "Gordo Sánchez de las Matas, Mateo", "Mejía López, Jonathan Moisés", "Villarrubia Moreno, Héctor", "Villavicencio López, Jonathan"], "2ºB": ["Acito Muñoz, Fabio", "Avilés Tassi, José Joaquín", "Cernea, Lucas Florín", "Chen Chen, Fengkai", "Chen Zhu, Wenhao", "Del Castillo, Gabriel Alejandro", "Eiras Gil, Saúl", "Elorza Delgado, Darío", "Hortigón Morán, Pablo", "Llana Vázquez, Luis", "Montoro Díaz, Álvaro", "Mora Rodríguez, David", "Rivera Luna, José Luis", "Rodríguez Galindo, José María", "Sanmartín Saavedra, Álvaro Guillermo", "Sovago Crisan, Alexandru", "Zamorano Vazquez, Mario Ronald"], "2ºC": ["Agudo Ares, Sergio", "Alcalde Berrendo, José Ignacio", "Asenjo Benavides, José Carlos", "Azapwah Nkeng, Gislain", "Benalcázar Torres, Mauricio", "Bravo Fernández, Carlos", "Buján Vicente, Álvaro", "Buna Sitoka, Alexander", "Cano Aliaga, Joseph Anthony", "Cuellar Hutupas, Jorge Gabriel", "De Pablo Sanz, Beltrán", "De Santiago Berrocal, Raúl", "De Torres Caraballo, Pablo", "Diamantis Contreras, Nestor Basil", "Flores Ramírez, Rodolfo Joaquín", "García Nieto, Miguel", "Hermoso Menéndez, Pablo", "Mera Cuesta, Ramsés", "Montesino Rodríguez, David", "Paja Álvarez, Gonzalo", "Pasán Díaz, Gabriel", "Pavón Mancheño, Nicolás", "Prado Perea, Pablo", "Rojas Fernández, Antonio", "Romero García, Juan", "Segovia Hernández, Moisés", "Solá Sánchez, Pablo", "Tendero Jiménez, Carlos", "Torres Betancur, Julián Mateo", "Vasquez Cabello, Massimo Octavio"], "2ºD": ["Aparicio Blazquez, Luis", "Fuertes García, Daniel", "González del Campo Alonso, Jesús Enrique", "González García, Santiago", "Lema Ávila, Aarón Alejandro", "López Rocamora, Rodrigo", "Martínez Escandon, José María", "Mendoza Pujalt, Jorge Augusto", "Ramírez Ferreira, Mateo", "Santamaría Torres, Daniel", "Santana Llanes, Samuel David", "Valverde León, Antonio"], "2ºA": ["Álvarez Pinto, Jesús Daniel", "Aponte Díaz, Thobias Manuel", "Caluseru, Cristian", "Centellas Solares, Rene Kaleb", "Collado Díaz, Juan", "de la Fuente Auquillas, Darío Miguel", "Dopico Martínez, Luca", "Garcia Florea, Diego", "Garcia Maciel, Alejandro Miguel", "García Palacios, Daniel", "Gavira Castillo, Alejandro", "Herranz Toril, Ángel Luis", "Jiménez Coello, Guillermo", "Martín Algaba, Víctor", "Martín Hurtado, Eloy", "Miranda Blazquez, Joel", "Moratiel Sánchez, Ángel", "Moreta Santander, Adrián Guillermo", "Naranjo El Rezz, Nicolás", "Niebla Ruiz de Pascual, Ismael", "Otamendi Roa, Jacob de Jesús", "Poliwani Castillejos, Eizan", "Ramos Castillo, Raúl", "She, Zewei", "Silva Rodríguez, Carlos Xavier", "Suárez Torrealba, Diego Ismael"]};

const CLASES = [
  {id:"1D-HMC", grupo:"1ºD", mat:"Historia del Mundo Contemporáneo", corto:"H.ª Mundo Cont."},
  {id:"2B-HE",  grupo:"2ºB", mat:"Historia de España",               corto:"H.ª España"},
  {id:"2C-HE",  grupo:"2ºC", mat:"Historia de España",               corto:"H.ª España"},
  {id:"2C-HA",  grupo:"2ºC", mat:"Historia del Arte",                corto:"H.ª Arte"},
  {id:"2D-HA",  grupo:"2ºD", mat:"Historia del Arte",                corto:"H.ª Arte"},
  {id:"2A-GEH", grupo:"2ºA", mat:"Geografía e Historia",             corto:"Geografía e H.ª"}
];
const porId = id => CLASES.find(c=>c.id===id) || CLASES[0];
const HORAS=[1,2,3,4,5,6,7];
const DIAS=["Lunes","Martes","Miércoles","Jueves","Viernes"];
const CICLO={P:"F",F:"R",R:"J",J:"P"};
const ICONO={P:"",F:"F",R:"R",J:"J"};
const NOMBRE_EST={F:"falta",R:"retraso",J:"justificada"};
const VERSION="1.5";   // debe coincidir con el VERSION de sw.js

/* ================= ALMACENAMIENTO VERIFICADO ================= */
let persistente=true, modoPersistente=null, ultimaVerif=null, fallo=null, corrupto=false;
try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }catch(e){ persistente=false; }

const K_SES="asist2627_sesiones", K_CFG="asist2627_config", K_ULT="asist2627_ultimo";

function crudo(k){ try{ return persistente ? localStorage.getItem(k) : null; }catch(e){ return null; } }

/* Si lo guardado no se puede interpretar, NO se devuelve un objeto vacío sin más:
   se conserva el original bajo otra clave y se avisa, para no sobrescribir el curso. */
function leerObjeto(k, def){
  const raw = crudo(k);
  if(raw===null || raw==="") return def;
  try{
    const o = JSON.parse(raw);
    if(o && typeof o === "object") return o;
    throw new Error("tipo inesperado");
  }catch(e){
    try{ localStorage.setItem(k+"_dañado_"+Date.now(), raw); }catch(e2){}
    corrupto = true;
    return def;
  }
}

/* Escribe y relee del disco para comprobar que el dato está realmente ahí. */
function escribir(k,v){
  const s=JSON.stringify(v);
  if(!persistente){
    fallo="este navegador no permite guardar en el dispositivo";
    return {ok:false, motivo:fallo};
  }
  try{
    localStorage.setItem(k,s);
    if(localStorage.getItem(k)!==s){
      fallo="lo escrito no coincide con lo releído";
      return {ok:false, motivo:fallo};
    }
    ultimaVerif=Date.now(); fallo=null;
    return {ok:true};
  }catch(e){
    const lleno = e && (e.name==="QuotaExceededError" || /quota|exceed/i.test(e.message||""));
    fallo = lleno ? "no queda espacio en el almacenamiento del navegador"
                  : "el navegador rechazó la escritura";
    return {ok:false, motivo:fallo};
  }
}

let sesiones = leerObjeto(K_SES, {});

/* Horario de Tajamar 26-27 ya cargado. Si lo cambias a mano, tus cambios mandan:
   solo se reescribe cuando sube CFG_VERSION. */
const CFG_VERSION = 3;
const HORARIO = {"0-3": "2C-HE", "0-5": "2B-HE", "0-6": "2C-HA", "0-7": "2D-HA", "1-2": "2C-HA", "1-3": "2D-HA", "1-4": "2B-HE", "1-5": "1D-HMC", "2-2": "2C-HE", "2-3": "2D-HA", "2-4": "1D-HMC", "2-5": "2A-GEH", "2-6": "2C-HA", "2-7": "2B-HE", "3-1": "2C-HA", "3-2": "2A-GEH", "3-3": "1D-HMC", "3-4": "2C-HE", "4-2": "1D-HMC", "4-3": "2A-GEH", "4-4": "2B-HE", "4-6": "2D-HA", "4-7": "2C-HE"};
const CFG_DEF = {cfgVersion:CFG_VERSION, horario:HORARIO,
  inicios:["08:00","09:00","09:55","11:25","12:20","13:10","14:05"],
  fines:  ["08:55","09:50","10:40","12:15","13:05","14:00","14:50"],
  ultimoBackup:null, syncUrl:""};

let config;
{
  const g = leerObjeto(K_CFG, {});
  if(!g.cfgVersion || g.cfgVersion < CFG_VERSION){
    // Se conserva lo que es tuyo; se renueva lo que viene del centro.
    config = Object.assign({}, CFG_DEF, {
      syncUrl: g.syncUrl || "", ultimoBackup: g.ultimoBackup || null
    });
  } else {
    config = Object.assign({}, CFG_DEF, g);
  }
}

async function pedirPersistencia(){
  if(!navigator.storage || !navigator.storage.persisted) return;
  try{
    modoPersistente = await navigator.storage.persisted();
    if(!modoPersistente && navigator.storage.persist) modoPersistente = await navigator.storage.persist();
  }catch(e){ modoPersistente=null; }
  actualizarAviso();
}
const instalada = () => window.navigator.standalone===true ||
  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);

/* ========================= ESTADO ========================= */
let vista="lista", fecha=iso(new Date()), claseId=null, hora=null;
const filas = new Map();

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function clave(){return fecha+"|"+claseId+"|"+hora;}
function ses(){return sesiones[clave()]||null;}
function alumnos(){return ALUMNOS[porId(claseId).grupo]||[];}
function esHoy(){return fecha===iso(new Date());}
function ddmm(f){return f.split("-").reverse().join("/");}
function diaDe(f){return DIAS[(new Date(f+"T12:00")).getDay()-1]||"Fin de semana";}

const aMin = t => { const [h,m]=String(t).split(":").map(Number); return h*60+m; };

/* No busca "qué tramo es ahora" sino "cuál es mi próxima clase de hoy".
   Salta las horas libres: la primera clase del día cuyo final aún no ha
   pasado es la que toca, esté empezada o por empezar. */
function claseAhora(){
  const d=new Date(), dia=d.getDay()-1;
  if(dia<0||dia>4) return null;                       // fin de semana: no inventa nada
  const ahora=d.getHours()*60+d.getMinutes();
  const fines=config.fines.map(aMin);
  const mias=HORAS.filter(h=>config.horario[dia+"-"+h]);
  if(!mias.length) return null;                       // día sin clases suyas
  const GRACIA=3;                                     // margen para cerrar el parte al salir
  for(const h of mias){
    if(ahora <= fines[h-1]+GRACIA)
      return {hora:h, id:config.horario[dia+"-"+h], dia:dia};
  }
  const ult=mias[mias.length-1];                      // jornada terminada
  return {hora:ult, id:config.horario[dia+"-"+ult], dia:dia, pasada:true};
}

function autoSeleccionar(){
  const a=claseAhora();
  if(a){
    claseId=a.id; hora=a.hora;
    return true;
  }
  const g=leerObjeto(K_ULT,null);
  claseId=(g&&g.c)||CLASES[0].id;
  hora=(g&&g.h)||1;
  if(!CLASES.some(c=>c.id===claseId)) claseId=CLASES[0].id;
  return false;
}

/* ========================= RENDER ========================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function pintarCabecera(){
  const c=porId(claseId), s=ses();

function clasesDe(f){
  const dia=(new Date(f+"T12:00")).getDay()-1;
  if(dia<0||dia>4) return [];
  return HORAS.filter(x=>config.horario[dia+"-"+x]).map(x=>({h:x, id:config.horario[dia+"-"+x]}));
}
function estadoDe(f,id,x){
  const s=sesiones[f+"|"+id+"|"+x];
  if(!s) return {txt:"sin registrar", cls:"neutro"};
  const n=Object.keys(s.e||{}).length;
  if(s.ts) return {txt:(n?n+" incidencia"+(n>1?"s":""):"sin incidencias"), cls:"ok"};
  return {txt:(n?"sin confirmar · "+n:"sin confirmar"), cls:"aviso"};
}
/* Clases de hoy que ya han terminado y siguen sin parte cerrado. */
function olvidadas(){
  if(fecha!==iso(new Date())) return 0;
  const d=new Date(), ahora=d.getHours()*60+d.getMinutes(), fin=config.fines.map(aMin);
  return clasesDe(fecha).filter(c=>ahora>fin[c.h-1]&&!(sesiones[fecha+"|"+c.id+"|"+c.h]||{}).ts).length;
}

function acumulado(nombre){
  let f=0;
  for(const k in sesiones){
    if(k.split("|")[1]!==claseId) continue;
    if((sesiones[k].e||{})[nombre]==="F") f++;
  }
  return f;
}

/* La lista se construye una vez por clase; marcar solo repinta esa fila.
   Repintar las 30 filas en cada toque hacía saltar el scroll en iOS. */
function construirLista(){
  const cont=$("#list"); cont.innerHTML=""; filas.clear();
  if(alumnos().length===0){
    cont.innerHTML='<div class="banner">Todavía no está cargada la lista de alumnos de '+
      esc(porId(claseId).grupo)+'. No se puede pasar lista en este grupo.</div>';
    pintarTally(); actualizarBanner(); return;
  }
  const frag=document.createDocumentFragment();
  alumnos().forEach((nombre,i)=>{
    const p=nombre.split(",");
    const row=document.createElement("div");
    row.className="row"; row.tabIndex=0; row.setAttribute("role","button");
    row.innerHTML='<div class="num">'+(i+1)+'</div>'+
      '<div class="nm"><b>'+esc(p[0])+'</b>'+(p[1]?'<span>,'+esc(p[1])+'</span>':'')+'</div>'+
      '<div class="acc oculto"></div><div class="note">✎</div><div class="st"></div>';
    row.onclick=e=>{
      if(movido) return;                         // era un scroll, no un toque
      if(e.target.classList.contains("note")) abrirNota(nombre); else marcar(nombre);
    };
    row.onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();marcar(nombre);} };
    filas.set(nombre,{el:row, acc:row.querySelector(".acc"),
      note:row.querySelector(".note"), st:row.querySelector(".st")});
    frag.appendChild(row);
  });
  cont.appendChild(frag);
  alumnos().forEach(refrescarFila);
  pintarTally(); actualizarBanner();
}
function refrescarFila(nombre){
  const f=filas.get(nombre); if(!f) return;
  const s=ses(), st=(s&&s.e&&s.e[nombre])||"P", nota=(s&&s.t&&s.t[nombre])||"";
  const a=acumulado(nombre);
  f.el.dataset.s=st;
  f.st.textContent=ICONO[st];
  f.acc.textContent=a>0?a+" F":"";
  f.acc.classList.toggle("oculto",a===0);
  f.note.classList.toggle("has",!!nota);
  f.el.setAttribute("aria-label",nombre+": "+(st==="P"?"presente":NOMBRE_EST[st]));
}

function marcar(nombre){
  const k=clave();
  if(!sesiones[k]) sesiones[k]={e:{},t:{},ts:null,sync:null};
  const sig=CICLO[sesiones[k].e[nombre]||"P"];
  if(sig==="P") delete sesiones[k].e[nombre]; else sesiones[k].e[nombre]=sig;
  sesiones[k].sync=null;
  const r=escribir(K_SES,sesiones);
  refrescarFila(nombre); pintarTally(); actualizarBanner();
  if(!r.ok) mostrarRecibo(false,"No se ha podido guardar: "+r.motivo);
}

function pintarTally(){
  const s=ses(), e=(s&&s.e)||{}, n={F:0,R:0,J:0};
  Object.values(e).forEach(v=>{ if(n[v]!==undefined) n[v]++; });
  const tot=alumnos().length, p=[];
  if(n.F)p.push(n.F+" falta"+(n.F>1?"s":""));
  if(n.R)p.push(n.R+" retraso"+(n.R>1?"s":""));
  if(n.J)p.push(n.J+" justificada"+(n.J>1?"s":""));
  $("#tally").innerHTML="<b>"+(tot-n.F-n.R-n.J)+"/"+tot+"</b> presentes"+(p.length?" · "+p.join(" · "):"");
  const b=$("#btnSave");
  if(s&&s.ts){ b.textContent="Cerrado ✓"; b.classList.add("done"); }
  else { b.textContent="Confirmar"; b.classList.remove("done"); $("#recibo").innerHTML=""; }
}
function mostrarRecibo(ok,txt){
  $("#recibo").innerHTML='<div class="recibo '+(ok?"ok":"mal")+'">'+esc(txt)+'</div>';
}
function actualizarBanner(){
  const b=$("#banner"); let t="";
  if(corrupto) t="Se han encontrado datos guardados que no se pueden leer. Se ha conservado una copia intacta. No borres nada y restaura tu último .json desde Ajustes.";
  else if(fallo) t="Atención: el último guardado ha fallado ("+fallo+"). Apunta las faltas en otro sitio y revisa Ajustes.";
  b.innerHTML = t ? '<div class="banner">'+esc(t)+'</div>' : "";
}

/* ---------- confirmar ---------- */
$("#btnSave").onclick=async ()=>{
  const k=clave();
  if(!sesiones[k]) sesiones[k]={e:{},t:{},ts:null,sync:null};
  if(sesiones[k].ts){
    if(!confirm("Este parte ya está cerrado. ¿Quieres reabrirlo para modificarlo?")) return;
    sesiones[k].ts=null; escribir(K_SES,sesiones);
    $("#recibo").innerHTML=""; pintarTally(); pintarCabecera(); return;
  }
  sesiones[k].ts=Date.now();
  const r=escribir(K_SES,sesiones);
  if(!r.ok){
    sesiones[k].ts=null; pintarTally(); actualizarBanner();
    mostrarRecibo(false,"NO se ha guardado: "+r.motivo+". Apunta las faltas en otro sitio.");
    return;
  }
  const disco=leerObjeto(K_SES,{})[k];
  const nInc=Object.keys(sesiones[k].e).length;
  if(!disco || !disco.ts || Object.keys(disco.e||{}).length!==nInc){
    mostrarRecibo(false,"NO se ha guardado correctamente. Apunta las faltas en otro sitio.");
    return;
  }
  const hh=new Date(disco.ts).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
  reciboBase="Guardado y verificado en el dispositivo a las "+hh+" · "+
    nInc+" incidencia"+(nInc===1?"":"s");
  mostrarRecibo(true,reciboBase);
  pintarTally(); pintarCabecera(); actualizarBanner();
  if(config.syncUrl) sincronizar([k]);
};
let reciboBase="";

/* ---------- nota ---------- */
function hoja(html){
  const ovl=document.createElement("div"); ovl.className="ovl";
  ovl.innerHTML='<div class="sheet">'+html+'</div>';
  document.body.appendChild(ovl);
  ovl.onclick=e=>{ if(e.target===ovl) ovl.remove(); };
  return ovl;
}
function abrirNota(nombre){
  const k=clave(), actual=(sesiones[k]&&sesiones[k].t&&sesiones[k].t[nombre])||"";
  const ovl=hoja('<h4>'+esc(nombre)+'</h4><p class="sub">Nota de esta sesión</p>'+
    '<textarea id="nt" placeholder="Justificante, aviso a familia, se marcha a las 12:30…">'+esc(actual)+'</textarea>'+
    '<div style="margin-top:10px;display:flex;gap:8px"><button class="btn" id="ntC">Cancelar</button>'+
    '<button class="btn dark" id="ntG" style="flex:1">Guardar nota</button></div>');
  ovl.querySelector("#ntC").onclick=()=>ovl.remove();
  ovl.querySelector("#ntG").onclick=()=>{
    if(!sesiones[k]) sesiones[k]={e:{},t:{},ts:null,sync:null};
    if(!sesiones[k].t) sesiones[k].t={};
    const v=ovl.querySelector("#nt").value.trim();
    if(v) sesiones[k].t[nombre]=v; else delete sesiones[k].t[nombre];
    sesiones[k].sync=null;
    const r=escribir(K_SES,sesiones);
    ovl.remove(); refrescarFila(nombre); actualizarBanner();
    if(!r.ok) mostrarRecibo(false,"No se ha podido guardar la nota: "+r.motivo);
  };
  setTimeout(()=>ovl.querySelector("#nt").focus(),50);
}

/* ---------- selector: día, clases de ese día y cualquier otra ---------- */

  const ir=(f,id,x)=>{ fecha=f; claseId=id; hora=x; recordar(); ovl.remove();

  const mover=n=>{ const d=new Date(fecha+"T12:00"); d.setDate(d.getDate()+n);

      '<div class="selNav"><button class="nav" id="pv" aria-label="Día anterior">‹</button>'+
        '<div class="selFecha"><b>'+esc(diaDe(fecha))+'</b><span>'+ddmm(fecha)+'</span></div>'+
        '<button class="nav" id="nx" aria-label="Día siguiente">›</button></div>'+

        ? dia.map(c=>{

              '<span class="selH">'+c.h+'ª</span>'+
              '<span class="selN"><b>'+esc(cl.grupo)+'</b><span>'+esc(cl.corto)+'</span></span>'+
              '<span class="selE '+st.cls+'">'+esc(st.txt)+'</span></button>';
          }).join("")
        : '<p class="muted" style="margin:0 0 12px">No tienes clase este día.</p>')+
      '<button class="otra" id="otraBtn">Otra clase u hora '+(otraAbierta?'▴':'▾')+'</button>'+
      '<div id="otra" class="'+(otraAbierta?'':'hide')+'">'+
        '<div class="chips" style="margin-bottom:9px">'+
          CLASES.map(c=>'<button class="chipL" data-c="'+c.id+'" aria-pressed="'+(c.id===claseId)+'">'+
            esc(c.grupo)+'<small>'+esc(c.corto)+'</small></button>').join("")+'</div>'+
        '<div class="chips">'+HORAS.map(x=>'<button class="chipL" data-x="'+x+'" aria-pressed="'+

        '<button class="btn dark" id="otraIr" style="width:100%;margin:11px 0 0">Ir a esa clase</button>'+

    cont.querySelectorAll(".selRow").forEach(b=>b.onclick=()=>ir(fecha,b.dataset.id,+b.dataset.h));
    cont.querySelector("#otraBtn").onclick=()=>{ otraAbierta=!otraAbierta; dibujar(); };
    let cSel=claseId, xSel=hora;
    cont.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
      cSel=b.dataset.c;
      cont.querySelectorAll("[data-c]").forEach(o=>o.setAttribute("aria-pressed",o.dataset.c===cSel));
    });
    cont.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{
      xSel=+b.dataset.x;
      cont.querySelectorAll("[data-x]").forEach(o=>o.setAttribute("aria-pressed",+o.dataset.x===xSel));
    });
    cont.querySelector("#otraIr").onclick=()=>ir(fecha,cSel,xSel);
  }
  dibujar();
}

/* ================= COPIA EN LA NUBE ================= */
function pendientes(){
  if(!config.syncUrl) return [];
  return Object.keys(sesiones).filter(k=>sesiones[k].ts&&!sesiones[k].sync);
}
async function sincronizar(claves){
  if(!config.syncUrl) return;
  const lista=claves||pendientes();
  if(!lista.length) return;
  const lote=lista.slice(0,40).map(k=>{
    const [f,id,h]=k.split("|"), c=porId(id), s=sesiones[k];
    return {clave:k,fecha:f,hora:+h,grupo:c.grupo,materia:c.mat,cerrado:s.ts,
      incidencias:Object.keys(s.e||{}).map(nm=>({alumno:nm,estado:NOMBRE_EST[s.e[nm]],nota:(s.t&&s.t[nm])||""}))};
  });
  try{
    const res=await fetch(config.syncUrl,{method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({sesiones:lote})});
    const data=await res.json();
    if(!data||!data.ok) throw new Error("respuesta inesperada");
    lote.forEach(x=>{ if(sesiones[x.clave]) sesiones[x.clave].sync=Date.now(); });
    escribir(K_SES,sesiones);
    if(claves && reciboBase) mostrarRecibo(true, reciboBase+" · copia en la nube ✓");
  }catch(e){
    if(claves) avisar("Guardado en el móvil, pero sin copia en la nube todavía");
  }
  actualizarAviso();
}

/* ========================= RESUMEN ========================= */
function pintarResumen(){
  const cont=$("#viewSum"), c=porId(claseId);
  const meses=[...new Set(Object.keys(sesiones).filter(k=>k.split("|")[1]===claseId)
    .map(k=>k.split("|")[0].slice(0,7)))].sort().reverse();
  const filtro=cont.dataset.mes||"todo";
  const tot={}, cuando={}; let nSes=0;
  for(const k in sesiones){
    const [f,id]=k.split("|");
    if(id!==claseId) continue;
    if(filtro!=="todo"&&!f.startsWith(filtro)) continue;
    nSes++;
    const e=sesiones[k].e||{};
    for(const nm in e){
      if(!tot[nm]){tot[nm]={F:0,R:0,J:0};cuando[nm]=[];}
      tot[nm][e[nm]]++;
      cuando[nm].push(ddmm(f)+" "+k.split("|")[2]+"ª "+e[nm]);
    }
  }
  const filas=Object.entries(tot).sort((a,b)=>(b[1].F*3+b[1].R)-(a[1].F*3+a[1].R));
  cont.innerHTML='<h2>'+esc(c.grupo)+' · '+esc(c.corto)+'</h2>'+
    '<p class="lead">'+nSes+' sesión'+(nSes===1?"":"es")+' registrada'+(nSes===1?"":"s")+
      ' · '+filas.length+' alumno'+(filas.length===1?"":"s")+' con incidencias</p>'+
    '<div class="block"><h3>Periodo</h3><select id="selMes"><option value="todo">Todo el curso</option>'+
      meses.map(m=>'<option value="'+m+'"'+(m===filtro?' selected':'')+'>'+ddmm(m)+'</option>').join("")+
    '</select></div><div class="block">'+
    (filas.length?'<table><tr><th>Alumno</th><th class="n">F</th><th class="n">R</th><th class="n">J</th></tr>'+
      filas.map(([nm,v],i)=>'<tr class="alu" data-i="'+i+'"><td>'+esc(nm)+'</td><td class="n">'+(v.F||"·")+
        '</td><td class="n">'+(v.R||"·")+'</td><td class="n">'+(v.J||"·")+'</td></tr>'+
        '<tr class="det-fila hide" data-d="'+i+'"><td class="det" colspan="4">'+
        esc(cuando[nm].join(" · "))+'</td></tr>').join("")+'</table>'+
      '<p class="muted" style="margin:9px 0 0">Toca un alumno para ver las fechas.</p>'
      :'<p class="muted">Ninguna incidencia en este periodo.</p>')+
    '</div><div class="block"><h3>Exportar</h3>'+
      '<button class="btn" id="expInc">Incidencias (CSV)</button>'+
      '<button class="btn" id="expRes">Resumen por alumno (CSV)</button>'+
      '<p class="muted">Incluye todos los grupos, no solo este.</p></div>';
  $("#selMes").onchange=e=>{cont.dataset.mes=e.target.value;pintarResumen();};
  cont.querySelectorAll("tr.alu").forEach(tr=>tr.onclick=()=>{
    const d=cont.querySelector('tr[data-d="'+tr.dataset.i+'"]');
    if(d) d.classList.toggle("hide");
  });
  $("#expInc").onclick=exportarIncidencias;
  $("#expRes").onclick=()=>exportarResumen(filtro);
}

/* Safari en iPhone ignora el atributo download y abre el archivo en una pestaña.
   Con la hoja de compartir se puede guardar en Archivos o Drive de verdad. */
async function entregar(nombre, texto, tipo){
  const contenido = tipo==="application/json" ? texto : "\ufeff"+texto;
  try{
    const f=new File([contenido], nombre, {type:tipo});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      await navigator.share({files:[f], title:nombre});
      return true;
    }
  }catch(e){ if(e && e.name==="AbortError") return false; }
  const blob=new Blob([contenido],{type:tipo+";charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  return true;
}
function csv(f){return f.map(r=>r.map(x=>String(x).replace(/[;\n\r]/g," ")).join(";")).join("\r\n");}
function exportarIncidencias(){
  const filas=[["Fecha","Dia","Hora","Grupo","Materia","Alumno","Estado","Nota","Cerrado"]];
  Object.keys(sesiones).sort().forEach(k=>{
    const [f,id,h]=k.split("|"), c=porId(id), s=sesiones[k];
    for(const nm in (s.e||{}))
      filas.push([f,diaDe(f),h,c.grupo,c.mat,nm,NOMBRE_EST[s.e[nm]],(s.t&&s.t[nm])||"",s.ts?"sí":"no"]);
  });
  if(filas.length===1){ avisar("Todavía no hay incidencias que exportar"); return; }
  entregar("incidencias_"+fecha+".csv",csv(filas),"text/csv");
}
function exportarResumen(filtro){
  const tot={};
  for(const k in sesiones){
    const [f,id]=k.split("|");
    if(filtro!=="todo"&&!f.startsWith(filtro)) continue;
    const e=sesiones[k].e||{};
    for(const nm in e){const x=id+"|"+nm; if(!tot[x])tot[x]={F:0,R:0,J:0}; tot[x][e[nm]]++;}
  }
  const filas=[["Grupo","Materia","Alumno","Faltas","Retrasos","Justificadas"]];
  Object.keys(tot).sort().forEach(x=>{
    const [id,nm]=x.split("|"), c=porId(id), v=tot[x];
    filas.push([c.grupo,c.mat,nm,v.F,v.R,v.J]);
  });
  if(filas.length===1){ avisar("Todavía no hay incidencias que exportar"); return; }
  entregar("resumen_asistencia.csv",csv(filas),"text/csv");
}

/* ========================= AJUSTES ========================= */
function pintarAjustes(){
  const cont=$("#viewCfg");
  const nBack=config.ultimoBackup?new Date(config.ultimoBackup).toLocaleDateString("es-ES"):"nunca";
  const diasSin=config.ultimoBackup?Math.floor((Date.now()-config.ultimoBackup)/86400000):999;
  const pend=pendientes().length;
  const sn=b=>b?'<b class="si">sí</b>':'<b class="no">no</b>';
  const sinConexion=!(navigator.serviceWorker&&navigator.serviceWorker.controller);

  cont.innerHTML=
    (corrupto?'<div class="warnbox rojo"><b>Datos ilegibles.</b> Se ha conservado una copia intacta bajo otra clave. Restaura tu último .json antes de seguir usándola.</div>':'')+
    (!persistente?'<div class="warnbox rojo"><b>Este navegador no está guardando nada.</b> Ábrela desde su dirección web en Safari, no desde una vista previa ni en navegación privada.</div>':'')+
    (persistente&&!instalada()?'<div class="warnbox"><b>Añádela a la pantalla de inicio.</b> Safari borra los datos de las webs que no visitas en 7 días; las apps de la pantalla de inicio están exentas. Compartir → Añadir a pantalla de inicio.</div>':'')+
    (diasSin>10?'<div class="warnbox">Última copia de seguridad: '+nBack+'. Descárgala y guárdala en Archivos o Drive.</div>':'')+
    '<h2>Ajustes</h2><p class="lead">'+Object.keys(sesiones).length+' sesiones registradas</p>'+

    '<div class="block"><h3>Estado del guardado</h3>'+
      '<div class="diag"><span>Guarda en este dispositivo</span>'+sn(persistente)+'</div>'+
      '<div class="diag"><span>Abierta desde la pantalla de inicio</span>'+sn(instalada())+'</div>'+
      '<div class="diag"><span>Datos marcados como permanentes</span>'+(modoPersistente===null?'<b class="muted">desconocido</b>':sn(modoPersistente))+'</div>'+
      '<div class="diag"><span>Funciona sin conexión</span>'+sn(!sinConexion)+'</div>'+
      '<div class="diag"><span>Última escritura verificada</span><b>'+(ultimaVerif?new Date(ultimaVerif).toLocaleString("es-ES"):"—")+'</b></div>'+
      '<button class="btn" id="probar" style="margin-top:11px">Probar el guardado ahora</button></div>'+

    '<div class="block"><h3>Detección automática</h3>'+
      '<div class="diag"><span>Ahora mismo</span><b>'+
        (["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][new Date().getDay()])+' '+
        new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})+'</b></div>'+
      '<div class="diag"><span>Te sitúa en</span><b>'+(()=>{ const a=claseAhora();
        return a ? esc(porId(a.id).grupo+" · "+porId(a.id).corto+" · "+a.hora+"ª"+(a.pasada?" (jornada terminada)":""))
                 : "nada: hoy no tienes clase"; })()+'</b></div>'+
      '<p class="muted" style="margin:9px 0 0">Si esto no coincide con tu horario real, revisa los tramos y la rejilla de abajo.</p></div>'+
    '<div class="block"><h3>Copia de seguridad</h3>'+
      '<button class="btn dark" id="bkGuardar">Guardar copia (.json)</button>'+
      '<button class="btn" id="bkCargar">Restaurar copia</button>'+
      '<input type="file" id="bkFile" accept=".json,application/json" class="hide">'+
      '<p class="muted">Última copia: '+nBack+'. Al guardarla se abre la hoja de compartir: elige Archivos o Drive.</p></div>'+

    '<div class="block"><h3>Copia automática en la nube</h3>'+
      '<input type="url" id="syncUrl" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(config.syncUrl||"")+'">'+
      '<p class="muted" style="margin:9px 0">Opcional. Cada parte confirmado se copia a tu hoja de cálculo. '+(pend?'<b>'+pend+' pendientes de enviar.</b>':'')+'</p>'+
      '<button class="btn" id="syncGuardar">Guardar dirección</button>'+
      (config.syncUrl?'<button class="btn" id="syncAhora">Enviar pendientes ('+pend+')</button>':'')+'</div>'+

    '<div class="block"><h3>Tramos horarios</h3>'+
      '<div class="grid7"><div></div><div class="muted">empieza</div><div class="muted">acaba</div></div>'+
      HORAS.map(h=>'<div class="grid7"><div class="muted">'+h+'ª</div>'+
        '<input type="time" data-ini="'+(h-1)+'" value="'+config.inicios[h-1]+'">'+
        '<input type="time" data-fin="'+(h-1)+'" value="'+config.fines[h-1]+'"></div>').join("")+'</div>'+

    '<h3 style="margin:18px 0 6px">Horario semanal</h3>'+
    '<p class="muted" style="margin-bottom:10px">Rellénalo y la app se abrirá sola en la clase que toca. Ojo: 2ºC aparece dos veces, una por asignatura.</p>'+
    DIAS.map((d,di)=>'<div class="block"><h3>'+d+'</h3>'+
      HORAS.map(h=>{
        const sel=config.horario[di+"-"+h]||"";
        return '<div class="grid5"><div class="muted">'+h+'ª</div><select data-dh="'+di+'-'+h+'">'+
          '<option value="">—</option>'+
          CLASES.map(c=>'<option value="'+c.id+'"'+(sel===c.id?' selected':'')+'>'+c.grupo+' · '+c.corto+'</option>').join("")+
          '</select></div>';
      }).join("")+'</div>').join("")+

    '<div class="block"><h3>Borrar</h3><button class="btn warn" id="borrar">Borrar todos los registros</button></div>'+
    '<div class="block"><h3>Versión</h3>'+
      '<div class="diag"><span>App</span><b>'+VERSION+'</b></div>'+
      '<div class="diag"><span>Caché instalada</span><b'+
        (versionSW&&versionSW!==VERSION?' class="no"':'')+'>'+(versionSW||"comprobando…")+'</b></div>'+
      (versionSW&&versionSW!==VERSION
        ? '<p class="muted">No coinciden: se está sirviendo una copia antigua. Pulsa Forzar actualización.</p>'
        : '')+
      (hayActualizacion?'<p class="muted">Hay una versión nueva lista; se aplicará al reabrir.</p>':'')+
      '<button class="btn" id="buscarAct" style="margin-top:10px">Buscar actualización</button>'+
      '<button class="btn warn" id="forzarAct">Forzar actualización</button>'+
      '<p class="muted">Ninguna de las dos toca tus registros.</p></div>';

  cont.querySelectorAll("select[data-dh]").forEach(s=>s.onchange=e=>{
    const dh=e.target.dataset.dh;
    if(e.target.value) config.horario[dh]=e.target.value; else delete config.horario[dh];
    escribir(K_CFG,config); avisar("Horario actualizado");
  });
  cont.querySelectorAll("input[data-ini]").forEach(i=>i.onchange=e=>{
    config.inicios[+e.target.dataset.ini]=e.target.value; escribir(K_CFG,config);
  });
  cont.querySelectorAll("input[data-fin]").forEach(i=>i.onchange=e=>{
    config.fines[+e.target.dataset.fin]=e.target.value; escribir(K_CFG,config);
  });
  $("#probar").onclick=()=>{
    const t="prueba_"+Date.now();
    const r=escribir("asist2627_prueba",t);
    let leido=null; try{ leido=JSON.parse(localStorage.getItem("asist2627_prueba")); }catch(e){}
    try{ localStorage.removeItem("asist2627_prueba"); }catch(e){}
    avisar(r.ok&&leido===t ? "Correcto: escrito y releído del dispositivo"
                           : "Fallo: "+(r.motivo||"no se pudo releer el dato"));
    pintarAjustes();
  };
  $("#bkGuardar").onclick=async()=>{
    const ok=await entregar("copia_asistencia_"+fecha+".json",
      JSON.stringify({version:VERSION,sesiones,config},null,1),"application/json");
    if(ok){ config.ultimoBackup=Date.now(); escribir(K_CFG,config); avisar("Copia generada"); pintarAjustes(); }
  };
  $("#bkCargar").onclick=()=>$("#bkFile").click();
  $("#bkFile").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d.sesiones||typeof d.sesiones!=="object") throw 0;
        const antes=Object.keys(sesiones).length;
        sesiones=Object.assign({},sesiones,d.sesiones);
        if(d.config) config=Object.assign(config,d.config);
        escribir(K_SES,sesiones); escribir(K_CFG,config);
        corrupto=false;
        avisar("Restaurado: "+(Object.keys(sesiones).length-antes)+" sesiones nuevas");
        pintarAjustes();
      }catch(err){ avisar("Ese archivo no es una copia válida"); }
    };
    r.readAsText(f);
  };
  $("#syncGuardar").onclick=()=>{
    const v=$("#syncUrl").value.trim();
    if(v && !/^https:\/\//.test(v)){ avisar("La dirección debe empezar por https://"); return; }
    config.syncUrl=v; escribir(K_CFG,config);
    avisar(v?"Dirección guardada":"Copia en la nube desactivada"); pintarAjustes();
  };
  if($("#syncAhora")) $("#syncAhora").onclick=async()=>{ avisar("Enviando…"); await sincronizar(); pintarAjustes(); };
  $("#borrar").onclick=()=>{
    if(confirm("¿Borrar TODOS los registros de asistencia? Descarga antes una copia.")){
      sesiones={}; escribir(K_SES,sesiones); avisar("Registros borrados"); pintarAjustes();
    }
  };
  $("#buscarAct").onclick=async()=>{
    if(!regSW){ avisar("Sin service worker activo"); return; }
    avisar("Buscando…");
    try{
      await regSW.update();
      await new Promise(r=>setTimeout(r,1200));        // dar tiempo a que instale
      const hay = hayActualizacion || !!(regSW.waiting || regSW.installing);
      avisar(hay ? "Versión nueva lista: se aplicará al reabrir la app"
                 : "Ya tienes la última ("+VERSION+")");
      pintarAjustes();
    }catch(e){ avisar("No se pudo comprobar. ¿Estás sin conexión?"); }
  };
  $("#forzarAct").onclick=forzarActualizacion;
}

/* ========================= NAVEGACIÓN ========================= */
function actualizarAviso(){
  const hay = corrupto || !!fallo || !persistente || !instalada() ||
              pendientes().length>0 || hayActualizacion ||
              (versionSW && versionSW!==VERSION);
  $("#dotCfg").classList.toggle("hide",!hay);
}
function pintar(){
  pintarCabecera();
  $("#bar").classList.toggle("hide",vista!=="lista");
  $("#viewLista").classList.toggle("hide",vista!=="lista");
  $("#viewSum").classList.toggle("hide",vista!=="sum");
  $("#viewCfg").classList.toggle("hide",vista!=="cfg");
  document.body.style.paddingBottom = vista==="lista" ? "" : "28px";
  if(vista==="lista") construirLista();
  if(vista==="sum") pintarResumen();
  if(vista==="cfg") pintarAjustes();
  actualizarAviso();
  window.scrollTo(0,0);
}
function recordar(){escribir(K_ULT,{c:claseId,h:hora});}

$("#ctxBig").onclick=()=>{ if(vista==="lista") abrirSelector(); };
$("#ctxSmall").onclick=()=>{ if(vista==="lista") abrirSelector(); };
$("#btnSum").onclick=()=>{vista="sum";pintar();};
$("#btnCfg").onclick=()=>{vista="cfg";pintar();};
$("#btnBack").onclick=()=>{vista="lista";pintar();};

let tOut;
function avisar(txt){
  const t=$("#toast"); t.textContent=txt; t.classList.add("on");
  clearTimeout(tOut); tOut=setTimeout(()=>t.classList.remove("on"),2400);
}

/* Un toque que empieza como arrastre es scroll, no una falta. */
let movido=false, y0=0;
document.addEventListener("touchstart",e=>{movido=false;y0=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchmove",e=>{
  if(Math.abs(e.touches[0].clientY-y0)>8) movido=true;
},{passive:true});

/* Recolocarse en la clase que toca: al volver a la app, al restaurarla desde
   la memoria y con el paso de las horas si se queda abierta encima de la mesa.
   Nunca pisa un parte a medio marcar. */
function reevaluar(){
  if(vista!=="lista") return;
  const s=ses();
  const aMedias = s && !s.ts && Object.keys(s.e||{}).length>0;
  const hoyIso=iso(new Date());
  if(aMedias && hoyIso===fecha) return;
  const a=claseAhora();
  if(!a) return;
  if(hoyIso===fecha && a.id===claseId && a.hora===hora) return;   // ya estamos donde toca
  fecha=hoyIso; claseId=a.id; hora=a.hora;
  recordar(); pintar();
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) return;
  reevaluar(); preguntarSW();
  if(config.syncUrl) sincronizar();
});
window.addEventListener("pageshow",reevaluar);
setInterval(reevaluar,60000);

/* ================= SIN CONEXIÓN Y ACTUALIZACIONES ================= */
let regSW=null, hayActualizacion=false, versionSW=null;

if("serviceWorker" in navigator){
  const habiaControl = !!navigator.serviceWorker.controller;
  let recargando=false;

  /* Cuando el service worker nuevo toma el control, la página se recarga sola
     una vez. Así la actualización se aplica sin cerrar nada a mano. */
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(!habiaControl || recargando) return;
    recargando=true;
    location.reload();
  });

  navigator.serviceWorker.addEventListener("message",e=>{
    if(e.data && e.data.swVersion){
      versionSW=e.data.swVersion;
      if(vista==="cfg") pintarAjustes();
      actualizarAviso();
    }
  });

  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(r=>{
      regSW=r;
      if(r.waiting) hayActualizacion=true;
      r.addEventListener("updatefound",()=>{
        const nuevo=r.installing; if(!nuevo) return;
        nuevo.addEventListener("statechange",()=>{
          if(nuevo.state==="installed"&&navigator.serviceWorker.controller){
            hayActualizacion=true; actualizarAviso();
          }
        });
      });
      preguntarSW();
    }).catch(()=>{});
  });
}
function preguntarSW(){
  if(navigator.serviceWorker && navigator.serviceWorker.controller)
    navigator.serviceWorker.controller.postMessage("version");
}
/* Salida de emergencia: borra service worker y cachés y vuelve a descargar la
   app. No toca localStorage, así que los registros se mantienen. */
async function forzarActualizacion(){
  if(!confirm("Se volverá a descargar la app desde cero.\n\nTus registros de asistencia NO se borran. ¿Continuar?")) return;
  avisar("Descargando de nuevo…");
  try{
    if(navigator.serviceWorker){
      const rs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r=>r.unregister()));
    }
    if(window.caches){
      const ks=await caches.keys();
      await Promise.all(ks.map(k=>caches.delete(k)));
    }
  }catch(e){}
  setTimeout(()=>location.reload(),400);
}

autoSeleccionar();
pintar();
pedirPersistencia();
if(config.syncUrl) sincronizar();
</script>
